# gstack's /browse and /qa drive this browser instead of Playwright's bundled
# Chromium (CAT-1416). Chrome stable comes from the AUR google-chrome package
# and is patched by yay -Syu. install.sh copies this file to
# ~/.config/environment.d/, so every systemd user unit gets it: the dispatcher,
# claude-rc@, the factory-* session units and the desktop session.
# Add nothing here that turns Chromium's sandbox off: install.sh refuses to
# finish if the user manager's environment would (factory/README.md, Browser).
GSTACK_CHROMIUM_PATH=/usr/bin/google-chrome-stable
