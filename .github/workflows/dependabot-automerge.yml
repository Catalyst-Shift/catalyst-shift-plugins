name: dependabot auto-merge

# HOW_WE_BUILD v2 §3. Patch and minor bumps turn on auto-merge; they merge when
# CI and the adversarial review check pass. Majors wait for a /next session.

# GitHub's documented pattern: `pull_request` + actor check; the permissions key
# below is honored for Dependabot-triggered runs.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
