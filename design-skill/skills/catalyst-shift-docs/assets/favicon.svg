<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-label="Catalyst Shift">
  <!-- The site's icon-size treatment: a "CS" monogram on Ink, the S in signal. Not a mark. -->
  <rect width="64" height="64" rx="14" fill="#15171B"/>
  <text x="32" y="43" text-anchor="middle" font-family="Switzer, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="30" letter-spacing="-1"><tspan fill="#F5F2EB">C</tspan><tspan fill="#34E2C2">S</tspan></text>
</svg>
